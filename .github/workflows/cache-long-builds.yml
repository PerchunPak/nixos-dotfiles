name: Cache long builds
on:
  workflow_dispatch:
  push:
    branches:
      - update_flake_lock_action

jobs:
  cache-long-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: perchunpak
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      - name: Disable AppArmor
        run: |
          # || true because https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2093797
          sudo aa-teardown || true
          sudo systemctl stop apparmor

      - name: Build and cache packages
        id: build
        background: true
        run: nix build --print-build-logs .#long-builds-to-cache --keep-going

      - name: Evaluate NixOS configurations
        id: eval
        background: true
        # explicit `bash` enables pipefail
        shell: bash
        run: |
          if ! systems=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json | jq -r '.[]'); then
            echo "Failed to list nixosConfigurations" >&2
            echo "failed=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          failed=()
          : > warnings.txt
          for system in $systems; do
            echo "::group::$system"
            if ! nix eval --raw ".#nixosConfigurations.$system.config.system.build.toplevel.drvPath" 2> stderr.txt; then
              failed+=("$system")
            fi
            echo
            cat stderr.txt >&2
            # Warnings start with a prefix, continuation lines are indented.
            awk -v name="$system" '
              /^(evaluation warning:|trace: warning:)/ { in_warning = 1; print "[" name "] " $0; next }
              in_warning && /^[[:space:]]/ { print; next }
              { in_warning = 0 }
            ' stderr.txt >> warnings.txt
            echo "::endgroup::"
          done

          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          [ ${#failed[@]} -eq 0 ]

      - name: Wait for build and eval
        wait: [build, eval]

      - name: Compose PR message
        if: always()
        run: |
          {
            if [ "${{ steps.build.outcome }}" = success ]; then
              echo "✅ Packages were cached!"
            else
              echo "❌ Caching packages failed, see the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            fi
            echo

            if [ "${{ steps.eval.outcome }}" = success ]; then
              echo "✅ All systems evaluate without errors."
            elif [ -n "${{ steps.eval.outputs.failed }}" ]; then
              echo "❌ These systems failed to evaluate: \`${{ steps.eval.outputs.failed }}\`"
            else
              echo "❌ Evaluating systems failed."
            fi

            if [ -s warnings.txt ]; then
              echo
              echo "⚠️ Evaluation produced warnings:"
              echo
              echo '```'
              cat warnings.txt
              echo '```'
            fi
          } > pr-message.md
          cat pr-message.md

      - name: Retrieve PR number
        if: always()
        run: |
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          PR_NUMBER="$(gh pr view update_flake_lock_action --json number --jq '.number')"
          echo "$PR_NUMBER"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        id: pr_number

      - name: Comment PR
        if: always()
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: pr-message.md
          pr-number: ${{ steps.pr_number.outputs.PR_NUMBER }}
